
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Lead Scoring Simulator — v8 (Simple • Colorful • Reactive)</title>
<style>
  :root{
    --bg:#0b1020; --text:#f8fafc; --muted:#20304a;
    --card:#0f172a; --accent:#22d3ee; --accent2:#8b5cf6;
    --hot:#ef4444; --warm:#f59e0b; --cold:#10b981;
  }
  *{box-sizing:border-box}
  body{
    margin:20px; font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
    background: radial-gradient(1200px 800px at 10% -10%, rgba(34,211,238,.12), transparent 40%),
                radial-gradient(1000px 700px at 110% 10%, rgba(139,92,246,.12), transparent 45%),
                linear-gradient(135deg, #0b1020, #0c1226);
    color:var(--text);
  }
  h1{font-size:26px;margin:0 0 6px 0}
  .sub{color:#cbd5e1;margin:0 0 16px 0}
  .grid{display:grid;grid-template-columns:1.1fr .9fr;gap:16px}
  .card{
    background:linear-gradient(0deg, rgba(255,255,255,.02), rgba(255,255,255,.01));
    border:1px solid var(--muted); border-radius:18px; padding:16px;
    box-shadow:0 10px 30px rgba(0,0,0,.25);
  }
  .row{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap}
  label{display:block;font-size:13px;color:#cbd5e1;margin:0 0 6px}
  input[type="number"]{
    padding:12px 14px; font-size:16px; border-radius:14px; border:1px solid var(--muted);
    background:#0a1222; color:var(--text); min-width:120px;
  }
  table{width:100%;border-collapse:collapse;margin-top:10px}
  th,td{padding:10px;border-bottom:1px solid #1b2944;font-size:14px}
  th{color:#cbd5e1;text-transform:uppercase;letter-spacing:.02em;font-size:12px}
  .kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .kpi{
    border:1px solid var(--muted); border-radius:16px; padding:14px; text-align:center;
    background:linear-gradient(0deg, rgba(255,255,255,.02), rgba(255,255,255,.01));
  }
  .kpi h3{margin:0;font-size:12px;color:#cbd5e1;text-transform:uppercase;letter-spacing:.04em}
  .kpi .v{font-size:28px;font-weight:800;margin-top:4px}
  .bar{height:26px;border-radius:999px;overflow:hidden;border:1px solid var(--muted);background:#0a1222}
  .barfill{height:100%;display:grid;grid-template-columns:var(--hotw) var(--warmw) var(--coldw)}
  .hotseg{background:var(--hot)} .warmseg{background:var(--warm)} .coldseg{background:var(--cold)}
  .legend{display:flex;gap:12px;color:#cbd5e1;font-size:12px}
  .sw{width:10px;height:10px;border-radius:2px;display:inline-block}
  .meta{margin-top:10px;color:#cbd5e1;font-size:12px}
  .pill{display:inline-block;padding:4px 10px;border-radius:999px;border:1px solid var(--muted);background:#0a1222;color:#cbd5e1;margin-right:6px}
  .err{display:none;margin-top:10px;padding:10px;border-radius:12px;border:1px solid #7f1d1d;background:#451a1a;color:#fecaca;font-size:13px}
  .accent{color:var(--accent)}
</style>
</head>
<body>
  <h1>Lead Scoring Simulator</h1>
  <p class="sub">Reactive. More color. Thresholds fixed: <span class="pill">Hot ≥ 100</span><span class="pill">Warm 50–99</span><span class="pill">Cold &lt; 50</span></p>

  <div class="grid">
    <div class="card">
      <div class="row">
        <div>
          <label>Number of leads</label>
          <input id="numLeads" type="number" min="1" step="1" value="100"/>
        </div>
      </div>
      <table>
        <thead><tr><th>Behavior</th><th style="width:150px">Points</th></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
      <div id="err" class="err"></div>
      <p class="meta">Rates are hidden and calibrated to yield about <span class="accent">30% Hot</span> at defaults.</p>
    </div>

    <div class="card">
      <div class="kpis">
        <div class="kpi"><h3>Hot</h3><div class="v" id="hotCount">0</div><div class="meta" id="hotPct">0%</div></div>
        <div class="kpi"><h3>Warm</h3><div class="v" id="warmCount">0</div><div class="meta" id="warmPct">0%</div></div>
        <div class="kpi"><h3>Cold</h3><div class="v" id="coldCount">0</div><div class="meta" id="coldPct">0%</div></div>
      </div>
      <div style="height:12px"></div>
      <div class="bar"><div id="barfill" class="barfill" style="--hotw:0%;--warmw:0%;--coldw:100%"><div class="hotseg"></div><div class="warmseg"></div><div class="coldseg"></div></div></div>
      <div class="legend" style="margin-top:8px">
        <span><i class="sw" style="background:var(--hot)"></i> Hot</span>
        <span><i class="sw" style="background:var(--warm)"></i> Warm</span>
        <span><i class="sw" style="background:var(--cold)"></i> Cold</span>
      </div>
      <p class="meta">Mean: <span id="mean">0</span> • Median: <span id="median">0</span> • P95: <span id="p95">0</span></p>
    </div>
  </div>

<script>
const categories = ["Form Submitted - Contact Us \u2013 \u201cSales\u201d", "Form Submitted - Contact Us \u2013 Other", "Opens Email\u200b", "Clicks in Email\u200b", "Registered for Webinar", "Attended Webinar", "Trade Show Booth Scan\u200b", "Booth Meeting with Rep\u200b \u200b", "Unsubscribe", "Hard bounce"];
const defaultPoints = [100, -100, 5, 10, 50, 50, 50, 100, -15, -100];
const hiddenRates = [0.07123336791992188, 0.005, 1.0, 0.569866943359375, 0.2849334716796875, 0.21370010375976561, 0.3561668395996094, 0.07123336791992188, 0.005, 0.01];

const HOT=100, WARM_MIN=50, WARM_MAX=99;

// Deterministic RNG used in all sims
function mulberry32(a){return function(){var t=a+=0x6D2B79F5; t=Math.imul(t^t>>>15,t|1); t^=t+Math.imul(t^t>>>7,t|61); return ((t^t>>>14)>>>0)/4294967296;}}

function buildRows(){
  const tb=document.getElementById('tbody');
  tb.innerHTML='';
  for(let i=0;i<categories.length;i++){
    const tr=document.createElement('tr');
    const td1=document.createElement('td'); td1.textContent=categories[i];
    const td2=document.createElement('td');
    const inp=document.createElement('input');
    inp.type='number'; inp.step='1'; inp.min='-1000'; inp.value=defaultPoints[i] ?? 0;
    inp.addEventListener('input', scheduleRun);
    td2.appendChild(inp);
    tr.appendChild(td1); tr.appendChild(td2); tb.appendChild(tr);
  }
}

function readConfig(){
  const n = Math.max(1, parseInt(document.getElementById('numLeads').value || '100', 10));
  const pts = [...document.querySelectorAll('#tbody input')].map(x => {
    const v = parseFloat(x.value || '0'); return isNaN(v) ? 0 : v;
  });
  return {n, pts};
}

function simulate(n, pts){
  const rng = mulberry32(42);
  const scores = new Array(n).fill(0);
  for(let i=0;i<n;i++){
    let s=0;
    for(let j=0;j<pts.length;j++){
      if(rng() < hiddenRates[j]) s += pts[j];
    }
    scores[i]=s;
  }
  return scores;
}

function summarize(scores){
  const n=scores.length;
  let hot=0, warm=0;
  for(const v of scores){
    if(v>=HOT) hot++;
    else if(v>=WARM_MIN && v<=WARM_MAX) warm++;
  }
  const cold=n-hot-warm;
  const sorted=[...scores].sort((a,b)=>a-b);
  const mean=scores.reduce((a,b)=>a+b,0)/n;
  const median=sorted[Math.floor(n/2)];
  const p95=sorted[Math.floor(0.95*(n-1))];
  return {hot,warm,cold,mean,median,p95};
}

function render(sum,n){
  const pct = v => (Math.round((v/n)*1000)/10).toFixed(1)+'%';
  document.getElementById('hotCount').textContent = sum.hot;
  document.getElementById('warmCount').textContent = sum.warm;
  document.getElementById('coldCount').textContent = sum.cold;
  document.getElementById('hotPct').textContent = pct(sum.hot);
  document.getElementById('warmPct').textContent = pct(sum.warm);
  document.getElementById('coldPct').textContent = pct(sum.cold);
  document.getElementById('mean').textContent = Math.round(sum.mean*10)/10;
  document.getElementById('median').textContent = sum.median;
  document.getElementById('p95').textContent = sum.p95;

  const hotw = sum.hot/n*100, warmw = sum.warm/n*100, coldw = 100 - hotw - warmw;
  const bar = document.getElementById('barfill');
  bar.style.setProperty('--hotw', hotw+'%');
  bar.style.setProperty('--warmw', warmw+'%');
  bar.style.setProperty('--coldw', coldw+'%');
}

let runTimer=null;
function scheduleRun(){
  if(runTimer) cancelAnimationFrame(runTimer);
  runTimer = requestAnimationFrame(runSafe);
}
function runSafe(){
  const err = document.getElementById('err');
  try{
    const {n, pts} = readConfig();
    const scores = simulate(n, pts);
    const sum = summarize(scores);
    render(sum, n);
    err.style.display='none'; err.textContent='';
  }catch(e){
    err.style.display='block'; err.textContent = 'Error: ' + (e && e.message ? e.message : e);
  }
}

document.getElementById('numLeads').addEventListener('input', scheduleRun);
buildRows();
scheduleRun();
</script>
</body>
</html>
